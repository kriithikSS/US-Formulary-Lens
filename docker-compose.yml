version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: formulary_lens_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_changeme}
      POSTGRES_DB: ${POSTGRES_DB:-formulary_lens}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d   # run once on first start
    shm_size: "256mb"                             # avoid OOM on small Docker alloc
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c log_min_duration_statement=500
        -c log_line_prefix='%t [%p]: '

  # Streamlit dashboard (Phase 4+)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: formulary_lens_app
    restart: unless-stopped
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      - db
    volumes:
      - ./parquet:/app/parquet:ro
      - ./models:/app/models:ro
    profiles:
      - app     # only start with: docker compose --profile app up

volumes:
  postgres_data:
    driver: local
